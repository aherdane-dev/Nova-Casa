<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Georgia, 'Times New Roman', serif">
  <rect width="800" height="500" fill="#f6f3ec"/>
  <!-- street grid -->
  <g stroke="#dcd7ca" stroke-width="2">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="430" x2="800" y2="430"/>
    <line x1="120" y1="0" x2="120" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>
  <g fill="#e9e4d8">
    <rect x="0" y="0" width="800" height="70"/>
    <rect x="0" y="450" width="800" height="50"/>
  </g>
  <text x="400" y="45" text-anchor="middle" fill="#9a917d" font-size="15" letter-spacing="6" font-family="Verdana, sans-serif">CARRER DE PONENT</text>
  <!-- parcel -->
  <path d="M 200 140 L 620 140 L 640 380 L 180 380 Z" fill="#123f2e" fill-opacity="0.07" stroke="#123f2e" stroke-width="3" stroke-dasharray="12 7"/>
  <circle cx="200" cy="140" r="6" fill="#b9903f"/>
  <circle cx="620" cy="140" r="6" fill="#b9903f"/>
  <circle cx="640" cy="380" r="6" fill="#b9903f"/>
  <circle cx="180" cy="380" r="6" fill="#b9903f"/>
  <text x="410" y="245" text-anchor="middle" fill="#123f2e" font-size="34" font-style="italic">Solar Urbà</text>
  <text x="410" y="285" text-anchor="middle" fill="#b9903f" font-size="22" letter-spacing="3" font-family="Verdana, sans-serif">± 420 m²</text>
  <text x="410" y="320" text-anchor="middle" fill="#6b756e" font-size="14" font-family="Verdana, sans-serif">Mollerussa · Sector Residencial</text>
  <!-- dimensions -->
  <text x="410" y="128" text-anchor="middle" fill="#6b756e" font-size="13" font-family="Verdana, sans-serif">21,0 m</text>
  <text x="150" y="265" text-anchor="middle" fill="#6b756e" font-size="13" font-family="Verdana, sans-serif" transform="rotate(-90 150 265)">20,0 m</text>
  <!-- north arrow -->
  <g transform="translate(730,70)">
    <circle r="26" fill="none" stroke="#b9903f" stroke-width="2"/>
    <path d="M 0 -16 L 7 10 L 0 4 L -7 10 Z" fill="#123f2e"/>
    <text y="44" text-anchor="middle" fill="#123f2e" font-size="14" font-family="Verdana, sans-serif">N</text>
  </g>
</svg>
